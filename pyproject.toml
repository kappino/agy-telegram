[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agy-telegram"
version = "0.2.1"

description = "Enterprise-grade Mobile Telegram Cockpit & Gateway for Google Antigravity (agy)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Antigravity Open Source Community", email = "oss@antigravity.dev" },
]
keywords = ["antigravity", "agy", "telegram", "ai-agent", "devops", "sysadmin", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    'tomli>=2.0.0; python_version < "3.11"',
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
agy-telegram = "agy_telegram.cli:main"
agy-notify = "agy_telegram.sentinel.client:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agy_telegram"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

